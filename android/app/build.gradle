plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "tech.dihas.tramoo"
    compileSdk 36

    defaultConfig {
        applicationId "tech.dihas.tramoo"
        minSdkVersion flutter.minSdkVersion      // nécessaire pour les .so modernes et 16K
        targetSdkVersion 36
        versionCode 10
        versionName "1.1.0"
        multiDexEnabled true  
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            //  Google recommande d'activer l'optimisation
            minifyEnabled true
            shrinkResources true

            //  Utiliser ProGuard pour réduire la taille
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        // Requis par flutter_local_notifications (Java 8+ APIs via desugaring)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    //  IMPORTANT pour compatibilité 16K
    packagingOptions {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    // Requis pour "core library desugaring" (voir erreur :flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Nécessaire pour WindowCompat.setDecorFitsSystemWindows (Android 15+ bord à bord)
    implementation 'androidx.core:core-ktx:1.15.0'
}

flutter {
    source = "../.."
}
